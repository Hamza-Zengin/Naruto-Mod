pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

if (file('../SekCLib').exists()) {
    includeBuild('../SekCLib') {
        dependencySubstitution {
            substitute module('com.sekwah:SekCLib') using project(':')
        }
    }
}
