name: Build and Release

on:
  push:
    branches: [ master, 'port/**' ]
  pull_request:
    branches: [ master, 'port/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Naruto-Mod

    steps:
      - name: Checkout Naruto-Mod
        uses: actions/checkout@v4
        with:
          path: Naruto-Mod

      - name: Checkout SekCLib (26.3 NeoForge)
        uses: actions/checkout@v4
        with:
          repository: Hamza-Zengin/SekCLib
          ref: master
          path: SekCLib

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Prepare repository
        run: |
          git fetch --unshallow --tags || true

      - name: Publish SekCLib 2.0.0 to mavenLocal
        working-directory: SekCLib
        run: ./gradlew publishToMavenLocal -PisRelease=true

      - name: Asset & Lang Validation
        run: |
          set -e
          for script in scripts/check_*.py; do
            echo "=== Running $script ==="
            python3 "$script"
          done

      - name: Run Tests
        run: ./gradlew test

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Playable Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: NarutoMod-26.3-v12.2
          path: |
            Naruto-Mod/build/libs/NarutoMod-*.jar
            !Naruto-Mod/build/libs/*-sources.jar

      - name: Upload Source Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NarutoMod-26.3-v12.2-sources
          path: |
            Naruto-Mod/build/libs/*-sources.jar
