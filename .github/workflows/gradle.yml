name: Build and Release

on:
  push:
    branches: [ master, 'port/**' ]
  pull_request:
    branches: [ master, 'port/**' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: Naruto-Mod

    steps:
      - name: Checkout Naruto-Mod
        uses: actions/checkout@v4
        with:
          path: Naruto-Mod

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Prepare repository
        run: |
          git fetch --unshallow --tags || true

      - name: Resolve SekCLib from GitHub Packages
        id: resolve-sekclib
        run: |
          if ./gradlew compileJava --refresh-dependencies; then
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SekCLib could not be resolved from GitHub Packages; falling back to source checkout."
            echo "resolved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout SekCLib (26.3 NeoForge fallback)
        if: steps.resolve-sekclib.outputs.resolved != 'true'
        uses: actions/checkout@v4
        with:
          repository: Hamza-Zengin/SekCLib
          ref: master
          path: SekCLib

      - name: Publish SekCLib 0.1.0 to mavenLocal (fallback)
        if: steps.resolve-sekclib.outputs.resolved != 'true'
        working-directory: SekCLib
        run: ./gradlew publishToMavenLocal -PisRelease=true

      - name: Asset & Lang Validation
        run: |
          set -e
          for script in scripts/check_*.py; do
            echo "=== Running $script ==="
            python3 "$script"
          done

      - name: Run Tests
        run: ./gradlew test

      - name: Run GameTests
        run: ./gradlew runGameTestServer

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Playable Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: NarutoMod-0.1.0
          path: |
            Naruto-Mod/build/libs/NarutoMod-*.jar
            !Naruto-Mod/build/libs/*-sources.jar

      - name: Upload Source Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NarutoMod-0.1.0-sources
          path: |
            Naruto-Mod/build/libs/*-sources.jar
