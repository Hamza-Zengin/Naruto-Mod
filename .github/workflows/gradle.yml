name: Build and Release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Prepare repository
        run: |
          git fetch --unshallow --tags || true

      - name: Run Model, Language, and Sound Audits
        run: |
          python3 scripts/check_model_parts.py
          python3 scripts/check_lang.py
          python3 scripts/check_sounds.py
          python3 scripts/check_item_models.py

      - name: Download MC assets
        run: ./gradlew downloadAssets || ./gradlew downloadAssets || (sleep 30s && ./gradlew downloadAssets)

      - name: Run Tests
        run: ./gradlew test

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Mod Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NarutoMod-1.20.1-v12.2
          path: build/libs/*.jar


