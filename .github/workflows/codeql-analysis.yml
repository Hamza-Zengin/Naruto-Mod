name: "CodeQL"

on:
  push:
    branches: [ master, 'port/**' ]
  pull_request:
    branches: [ master, 'port/**' ]
  schedule:
    - cron: '30 21 * * 4'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Resolve SekCLib from GitHub Packages
        id: resolve-sekclib
        run: |
          if ./gradlew compileJava --refresh-dependencies; then
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SekCLib could not be resolved from GitHub Packages; falling back to source checkout."
            echo "resolved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout SekCLib (26.3 NeoForge fallback)
        if: steps.resolve-sekclib.outputs.resolved != 'true'
        uses: actions/checkout@v4
        with:
          repository: Hamza-Zengin/SekCLib
          ref: master
          path: .sekclib

      - name: Publish SekCLib 0.1.0 to mavenLocal (fallback)
        if: steps.resolve-sekclib.outputs.resolved != 'true'
        working-directory: .sekclib
        run: ./gradlew publishToMavenLocal -PisRelease=true

      - name: Remove temporary SekCLib checkout
        if: steps.resolve-sekclib.outputs.resolved != 'true'
        run: rm -rf .sekclib

      - name: Clean build outputs before CodeQL tracing
        run: ./gradlew clean

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build with Gradle for CodeQL
        run: ./gradlew compileJava compileTestJava

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
